name: Disk info probe

on:
  workflow_dispatch:

jobs:
  diskinfo:
    runs-on: windows-latest
    steps:
      - name: Disks
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Select-Object Name,@{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}},@{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}},@{n='TotalGB';e={[math]::Round(($_.Used+$_.Free)/1GB,1)}} | Format-Table -AutoSize
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Host "USERPROFILE=$env:USERPROFILE"
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-Volume | Select-Object DriveLetter,FileSystemLabel,@{n='FreeGB';e={[math]::Round($_.SizeRemaining/1GB,1)}},@{n='TotalGB';e={[math]::Round($_.Size/1GB,1)}} | Format-Table -AutoSize

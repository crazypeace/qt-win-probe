name: Qt 6.11.2 static build probe (windows-latest)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  probe:
    name: Build Qt 6.11.2 on windows-latest
    runs-on: windows-latest
    env:
      QT_VER: "6.11.2"
    defaults:
      run:
        shell: cmd
    steps:
      - name: Runner / OS info
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS  ImageVersion=$env:ImageVersion"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Caption : $($os.Caption)"
          Write-Host "Version : $($os.Version)"
          Write-Host "Build   : $($os.BuildNumber)"
          try { Write-Host ("Defender DisableRealtimeMonitoring: " + (Get-MpPreference).DisableRealtimeMonitoring) } catch { Write-Host "Defender info unavailable" }
          $lp = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          Write-Host "LongPathsEnabled: $lp"
          Write-Host "Free disk (GB):"
          Get-PSDrive C | Select-Object Used,Free

      - name: Prepare TBuild layout (same as tdesktop)
        shell: cmd
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          dir %userprofile%

      - name: MSVC dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain versions
        shell: cmd
        run: |
          where cl
          cl 2>&1 | findstr /C:"Version"
          cmake --version
          where ninja & ninja --version
          where jom & jom -v
          git --version

      - name: Clone Qt source (v6.11.2 + submodules)
        shell: cmd
        run: |
          cd %userprofile%\TBuild
          git clone -b v%QT_VER% https://github.com/qt/qt5.git qt_%QT_VER%
          cd qt_%QT_VER%
          git submodule update --init --recursive --progress qtbase qtimageformats qtshadertools qtsvg
          dir

      - name: Configure Qt (static, debug-and-release)
        shell: cmd
        run: |
          cd %userprofile%\TBuild\qt_%QT_VER%
          if not exist "%TBuild%\ThirdParty" mkdir "%TBuild%\ThirdParty"
          call configure.bat ^
            -prefix "%userprofile%\TBuild\Libraries\win64\Qt-%QT_VER%" ^
            -debug-and-release ^
            -force-debug-info ^
            -opensource ^
            -confirm-license ^
            -static ^
            -static-runtime ^
            -no-feature-netlistmgr ^
            -nomake examples ^
            -nomake tests ^
            -platform win32-msvc

      - name: Build Qt Debug
        shell: cmd
        run: |
          cd %userprofile%\TBuild\qt_%QT_VER%
          cmake --build . --config Debug --parallel

      - name: Install Qt Debug (attempt 1, tolerant)
        continue-on-error: true
        shell: cmd
        run: |
          cd %userprofile%\TBuild\qt_%QT_VER%
          cmake --install . --config Debug

      - name: Install Qt Debug (attempt 2, retry)
        continue-on-error: true
        shell: cmd
        run: |
          cd %userprofile%\TBuild\qt_%QT_VER%
          cmake --install . --config Debug

      - name: Check Debug install result
        shell: cmd
        run: |
          if exist "%userprofile%\TBuild\Libraries\win64\Qt-%QT_VER%\lib\cmake\Qt6Gui" (
            echo DEBUG_INSTALL_OK
          ) else (
            echo DEBUG_INSTALL_MISSING
          )
          dir "%userprofile%\TBuild\Libraries\win64\Qt-%QT_VER%\lib\cmake" 2>nul | findstr /C:"Qt6"

      - name: Build Qt Release
        continue-on-error: true
        shell: cmd
        run: |
          cd %userprofile%\TBuild\qt_%QT_VER%
          cmake --build . --config Release --parallel

      - name: Install Qt Release
        continue-on-error: true
        shell: cmd
        run: |
          cd %userprofile%\TBuild\qt_%QT_VER%
          cmake --install . --config Release

      - name: Summary
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\TBuild\Libraries\win64\Qt-$env:QT_VER"
          Write-Host "Install root: $root"
          if (Test-Path $root) {
            Write-Host "== lib/cmake =="
            Get-ChildItem "$root\lib\cmake" -ErrorAction SilentlyContinue | Select-Object Name
            Write-Host "== bin =="
            Get-ChildItem "$root\bin" -ErrorAction SilentlyContinue | Select-Object Name | Select-Object -First 10
          } else {
            Write-Host "NOT INSTALLED"
          }
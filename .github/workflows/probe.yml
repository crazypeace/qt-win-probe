name: Qt 6.11.2 static build probe (windows-latest)

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  probe:
    name: Build Qt 6.11.2 on windows-latest
    runs-on: windows-latest
    env:
      QT_VER: "6.11.2"
    defaults:
      run:
        shell: cmd
    steps:
      - name: Runner / OS info
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS  ImageVersion=$env:ImageVersion"
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host "Caption : $($os.Caption)"
          Write-Host "Version : $($os.Version)"
          Write-Host "Build   : $($os.BuildNumber)"
          try { Write-Host ("Defender DisableRealtimeMonitoring: " + (Get-MpPreference).DisableRealtimeMonitoring) } catch { Write-Host "Defender info unavailable" }
          $lp = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled -ErrorAction SilentlyContinue).LongPathsEnabled
          Write-Host "LongPathsEnabled: $lp"
          Get-PSDrive C | Select-Object Used,Free

      - name: Prepare TBuild layout (same as tdesktop)
        shell: cmd
        run: |
          mkdir "%USERPROFILE%\TBuild\Libraries"
          mklink /d "%GITHUB_WORKSPACE%\TBuild" "%USERPROFILE%\TBuild"
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LIBS_DIR=%USERPROFILE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: MSVC dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show toolchain versions
        shell: cmd
        run: |
          cl 2>&1 | findstr /C:"Version"
          cmake --version
          ninja --version

      # ---- Cache 1: Qt source clone (git tree) ----
      - name: Restore Qt source cache
        id: cache-qt-src
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\qt_${{ env.QT_VER }}
          key: qt-src-${{ env.QT_VER }}-${{ runner.os }}-${{ runner.arch }}

      - name: Clone Qt source (v6.11.2 + submodules)
        if: steps.cache-qt-src.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%USERPROFILE%\TBuild"
          git clone -b v%QT_VER% https://github.com/qt/qt5.git qt_%QT_VER%
          cd /d "%USERPROFILE%\TBuild\qt_%QT_VER%"
          git submodule update --init --recursive --progress qtbase qtimageformats qtshadertools qtsvg
          if not exist configure.bat exit /b 1

      # ---- Cache 2: Qt build+install tree (the expensive artifact) ----
      - name: Restore Qt install cache
        id: cache-qt-install
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\Libraries\win64\Qt-${{ env.QT_VER }}
          key: qt-install-${{ env.QT_VER }}-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Configure Qt (static, debug-and-release)
        if: steps.cache-qt-install.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%USERPROFILE%\TBuild\qt_%QT_VER%"
          call configure.bat ^
            -prefix "%LIBS_DIR%\Qt-%QT_VER%" ^
            -debug-and-release ^
            -force-debug-info ^
            -opensource ^
            -confirm-license ^
            -static ^
            -static-runtime ^
            -feature-c++20 ^
            -trace no ^
            -platform win32-msvc ^
            -D ZLIB_WINAPI

      - name: Build Qt Debug
        if: steps.cache-qt-install.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%USERPROFILE%\TBuild\qt_%QT_VER%"
          cmake --build . --config Debug --parallel

      - name: Install Qt Debug
        if: steps.cache-qt-install.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          cd /d "%USERPROFILE%\TBuild\qt_%QT_VER%"
          cmake --install . --config Debug

      - name: Check Debug install result
        shell: cmd
        run: |
          if exist "%LIBS_DIR%\Qt-%QT_VER%\lib\cmake\Qt6Gui" (echo DEBUG_INSTALL_OK) else (echo DEBUG_INSTALL_MISSING)

      - name: Build Qt Release
        if: steps.cache-qt-install.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: cmd
        run: |
          cd /d "%USERPROFILE%\TBuild\qt_%QT_VER%"
          cmake --build . --config Release --parallel

      - name: Install Qt Release
        if: steps.cache-qt-install.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: cmd
        run: |
          cd /d "%USERPROFILE%\TBuild\qt_%QT_VER%"
          cmake --install . --config Release

      - name: Summary
        shell: pwsh
        run: |
          $root = "$env:USERPROFILE\TBuild\Libraries\win64\Qt-$env:QT_VER"
          Write-Host "Install root: $root"
          Write-Host "Install cache hit: ${{ steps.cache-qt-install.outputs.cache-hit }}"
          if (Test-Path $root) {
            Write-Host "== lib/cmake =="
            Get-ChildItem "$root\lib\cmake" -ErrorAction SilentlyContinue | Select-Object Name
          } else { Write-Host "NOT INSTALLED" }